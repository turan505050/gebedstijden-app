// ---------- astronomy ----------
const toRad = (d) => (d * Math.PI) / 180;
const toDeg = (r) => (r * 180) / Math.PI;
const fixAngle = (a) => { a = a % 360; return a < 0 ? a + 360 : a; };
function julianDate(date) {
  let Y = date.getUTCFullYear();
  let M = date.getUTCMonth() + 1;
  const D = date.getUTCDate();
  if (M <= 2) { Y -= 1; M += 12; }
  const A = Math.floor(Y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + D + B - 1524.5;
}
function sunPosition(jd) {
  const D = jd - 2451545.0;
  const g = fixAngle(357.529 + 0.98560028 * D);
  const q = fixAngle(280.459 + 0.98564736 * D);
  const L = fixAngle(q + 1.915 * Math.sin(toRad(g)) + 0.02 * Math.sin(toRad(2 * g)));
  const e = 23.439 - 0.00000036 * D;
  const RA = toDeg(Math.atan2(Math.cos(toRad(e)) * Math.sin(toRad(L)), Math.cos(toRad(L)))) / 15;
  const raFixed = ((RA % 24) + 24) % 24;
  const eqt = q / 15 - raFixed;
  const decl = toDeg(Math.asin(Math.sin(toRad(e)) * Math.sin(toRad(L))));
  return { declination: decl, equation: eqt };
}
function hourAngleDepression(lat, decl, angle) {
  const cosH = (-Math.sin(toRad(angle)) - Math.sin(toRad(lat)) * Math.sin(toRad(decl))) / (Math.cos(toRad(lat)) * Math.cos(toRad(decl)));
  return toDeg(Math.acos(Math.max(-1, Math.min(1, cosH)))) / 15;
}
function hourAngleElevation(lat, decl, angle) {
  const cosH = (Math.sin(toRad(angle)) - Math.sin(toRad(lat)) * Math.sin(toRad(decl))) / (Math.cos(toRad(lat)) * Math.cos(toRad(decl)));
  return toDeg(Math.acos(Math.max(-1, Math.min(1, cosH)))) / 15;
}
function asrAngle(factor, lat, decl) {
  const diff = Math.abs(lat - decl);
  return toDeg(Math.atan(1 / (factor + Math.tan(toRad(diff)))));
}
function computePrayerTimesUTC(date, lat, lon) {
  const jd = julianDate(date);
  const { declination: decl, equation: eqt } = sunPosition(jd);
  const solarNoon = 12 - eqt - lon / 15;
  const fajrH = hourAngleDepression(lat, decl, 18);
  const sunH = hourAngleDepression(lat, decl, 0.833);
  const ishaH = hourAngleDepression(lat, decl, 17);
  const asrH = hourAngleElevation(lat, decl, asrAngle(1, lat, decl));
  return {
    imsak: solarNoon - fajrH - 10 / 60,
    fajr: solarNoon - fajrH,
    sunrise: solarNoon - sunH,
    dhuhr: solarNoon + 2 / 60,
    asr: solarNoon + asrH,
    maghrib: solarNoon + sunH,
    isha: solarNoon + ishaH,
  };
}
function tzOffsetHours(date, timeZone) {
  try {
    const utcDate = new Date(date.toLocaleString("en-US", { timeZone: "UTC" }));
    const tzDate = new Date(date.toLocaleString("en-US", { timeZone }));
    return (tzDate.getTime() - utcDate.getTime()) / 3600000;
  } catch (e) { return 1; }
}
function formatLocal(utcHour, tz) {
  let h = ((utcHour + tz) % 24 + 24) % 24;
  let hh = Math.floor(h);
  let mm = Math.round((h - hh) * 60);
  if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }
  return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}
function instantFromUTCHour(baseDate, utcHour) {
  const ms = Date.UTC(baseDate.getUTCFullYear(), baseDate.getUTCMonth(), baseDate.getUTCDate()) + utcHour * 3600000;
  return new Date(ms);
}
function fmtHHMMSS(diffMs) {
  const h = Math.floor(diffMs / 3600000);
  const m = Math.floor((diffMs % 3600000) / 60000);
  const s = Math.floor((diffMs % 60000) / 1000);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function dayOfYear(d) {
  const start = Date.UTC(d.getUTCFullYear(), 0, 0);
  const diff = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - start;
  return Math.floor(diff / 86400000);
}

    "Yaşlı bir komşuna markette yardım et.", "Uzun zamandır konuşmadığın bir akrabanı ara.", "Bugün az da olsa sadaka ver.", "Yolda beş dakika çöp topla.", "Birine önce sen selam ver.", "Seni üzen birini affet.", "Yemeğini bir komşu veya iş arkadaşınla paylaş.", "Hasta birini ziyaret et ya da ara.", "Yol sorusuna cevap vererek birine yardım et.", "Artık giymediğin kıyafetleri bağışla.", "Anne babana belirli bir şey için teşekkür et.", "Senden sonrakiler için bir şey dik.", "Eski bir arkadaşına güzel bir mesaj gönder.", "Bugün küçük bir zevkten vazgeç, parasını bağışla.", "Mealiyle birlikte bir sayfa Kur'an oku.", "İşte veya okulda istenmeden birine yardım et.", "Hayvanlara veya kuşlara yiyecek ya da su ver.", "Seni zorlayan birine karşı sabırlı ol.", "Sadece 15 dakika bile olsa gönüllü çalış.", "Gördüğün bir iyilik için birini takdir et.", "Genelde aceleyle yaptığın bir işi zikir çekerek yap.", "Yalnız hissedebilecek birini davet et.", "Bir komşuna bir şey ödünç ver ya da tamir et.", "Bir yabancıya gülümse.", "Birine, haberi olmadan dua et.", "Birine faydalı bir şey öğret.", "Birine, kendisiyle ilgili olumlu bir şey söyle.", "Bir anlaşmazlıktan sonra ilk özür dileyen ol.", "Telefonunu bir kenara koy ve birini gerçekten dinle.", "Şükrettiğin üç şeyi düşün ve Allah'a şükret.",
  ],
};

const ZIKR_PRESETS = [
  { key: "subhanallah", label: "Subhan Allah", target: 33 },
  { key: "alhamdulillah", label: "Alhamdulillah", target: 33 },
  { key: "allahuakbar", label: "Allahu Akbar", target: 34 },
  { key: "lailahaillallah", label: "La ilaha illallah", target: 100 },
  { key: "astaghfirullah", label: "Astaghfirullah", target: 100 },
];

function GebedstijdenApp() {
  const [cityIdx, setCityIdx] = useState(0);
  const [now, setNow] = useState(new Date());
  const [tab, setTab] = useState("tijden");
  const [verseIdx, setVerseIdx] = useState(dayOfYear(new Date()) % 30);
  const [zikrKey, setZikrKey] = useState(ZIKR_PRESETS[0].key);
  const [zikrCounts, setZikrCounts] = useState({});
  const [challengeDone, setChallengeDone] = useState(false);

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  const city = CITIES[cityIdx];
  const t = LANGS[city.lang] || LANGS.en;
  const contentLang = CONTENT_LANGS.includes(city.lang) ? city.lang : "en";
  const quranList = QURAN[contentLang];
  const challengeList = CHALLENGES[contentLang];

  const tz = useMemo(() => tzOffsetHours(now, city.tz), [now, city.tz]);
  const timesUTC = useMemo(() => computePrayerTimesUTC(now, city.lat, city.lon), [now, city.lat, city.lon]);

  const rows = PRAYER_ORDER.map((key) => ({
    key,
    local: formatLocal(timesUTC[key], tz),
    Icon: PRAYER_ICON[key],
    label: t.prayerLabels[key],
  }));

  const { nextPrayer, current } = useMemo(() => {
    const list = COUNTDOWN_KEYS.map((k) => ({ key: k, instant: instantFromUTCHour(now, timesUTC[k]) }));
    let next = list.find((p) => p.instant > now);
    let cur = null;
    for (let i = list.length - 1; i >= 0; i--) { if (list[i].instant <= now) { cur = list[i].key; break; } }
    if (!next) next = { key: list[0].key, instant: instantFromUTCHour(new Date(now.getTime() + 86400000), timesUTC[list[0].key]) };
    return { nextPrayer: next, current: cur };
  }, [now, timesUTC]);

  const countdown = fmtHHMMSS(nextPrayer.instant - now);
  const verse = quranList[verseIdx % quranList.length];
  const challenge = challengeList[dayOfYear(now) % challengeList.length];
  const zikr = ZIKR_PRESETS.find((z) => z.key === zikrKey);
  const count = zikrCounts[zikrKey] || 0;
  const totalToday = Object.values(zikrCounts).reduce((a, b) => a + b, 0);
  const dateLabel = now.toLocaleDateString(t.locale, { weekday: "long", day: "numeric", month: "long" });

  return (
    <div className="pt-app" dir={t.dir}>
      <div className="pt-hero">
        <div className="pt-hero-top">
          <span>{dateLabel}</span>
          <span className="pt-city-select">
            <IconPin size={13} />
            <select value={cityIdx} onChange={(e) => setCityIdx(Number(e.target.value))}>
              {REGIONS.map((region) => (
                <optgroup key={region} label={region}>
                  {CITIES.map((c, i) => c.region === region ? <option key={c.name} value={i}>{c.name} ({c.country})</option> : null)}
                </optgroup>
              ))}
            </select>
          </span>
        </div>
        <div className="pt-next-label">{t.next}</div>
        <div className="pt-next-name">{t.prayerLabels[nextPrayer.key]}</div>
        <div className="pt-next-count">{countdown} &middot; {formatLocal(timesUTC[nextPrayer.key], tz)}</div>
      </div>

      <div className="pt-tabs">
        <div className={`pt-tab ${tab === "tijden" ? "active" : ""}`} onClick={() => setTab("tijden")}><IconClock size={17} />{t.tabs[0]}</div>
        <div className={`pt-tab ${tab === "ayet" ? "active" : ""}`} onClick={() => setTab("ayet")}><IconBook size={17} />{t.tabs[1]}</div>
        <div className={`pt-tab ${tab === "zikr" ? "active" : ""}`} onClick={() => setTab("zikr")}><IconSparkles size={17} />{t.tabs[2]}</div>
        <div className={`pt-tab ${tab === "uitdaging" ? "active" : ""}`} onClick={() => setTab("uitdaging")}><IconHeart size={17} />{t.tabs[3]}</div>
      </div>

      <div className="pt-body">
        {tab === "tijden" && (
          <div>
            {rows.map((r) => {
              const RowIcon = r.Icon;
              const isNow = r.key === current;
              return (
                <div key={r.key} className={`pt-row ${isNow ? "now" : ""}`}>
                  <div className="pt-row-left">
                    <div className="pt-row-icon"><RowIcon size={16} /></div>
                    <div className="pt-row-nl">{r.label}</div>
                  </div>
                  <div className="pt-row-time">{r.local}</div>
                </div>
              );
            })}
            <div className="pt-note">{t.timesNote}</div>
          </div>
        )}

        {tab === "ayet" && (
          <div>
            <div className="pt-verse-card">
              <div className="pt-verse-ref">{verse.ref}</div>
              <div className="pt-verse-text">{verse.text}</div>
            </div>
            <div className="pt-verse-nav">
              <div className="pt-icon-btn" onClick={() => setVerseIdx((verseIdx - 1 + quranList.length) % quranList.length)}><IconChevronLeft size={16} /></div>
              <div className="pt-icon-btn" onClick={() => setVerseIdx(dayOfYear(now) % quranList.length)}><IconBook size={16} /></div>
              <div className="pt-icon-btn" onClick={() => setVerseIdx((verseIdx + 1) % quranList.length)}><IconChevronRight size={16} /></div>
            </div>
            <div className="pt-note" style={{ textAlign: "center" }}>{t.verseNote}</div>
          </div>
        )}

        {tab === "zikr" && (
          <div>
            <div className="pt-zikr-select">
              {ZIKR_PRESETS.map((z) => (
                <div key={z.key} className={`pt-zikr-chip ${z.key === zikrKey ? "active" : ""}`} onClick={() => setZikrKey(z.key)}>{z.label}</div>
              ))}
            </div>
            <div className="pt-counter-wrap">
              <div className="pt-counter-btn" onClick={() => setZikrCounts((c) => ({ ...c, [zikrKey]: (c[zikrKey] || 0) + 1 }))}>
                <div className="pt-counter-num">{count}</div>
                <div className="pt-counter-target">{t.goal}: {zikr.target}</div>
              </div>
              <div className="pt-reset" onClick={() => setZikrCounts((c) => ({ ...c, [zikrKey]: 0 }))}>
                <IconRotate size={14} /> {t.reset(zikr.label)}
              </div>
              <div className="pt-total">{t.total(totalToday)}</div>
            </div>
          </div>
        )}

        {tab === "uitdaging" && (
          <div className="pt-challenge-card">
            <div className="pt-challenge-eyebrow">{t.eyebrow}</div>
            <div className="pt-challenge-text">{challenge}</div>
            <div className={`pt-done-btn ${challengeDone ? "done" : ""}`} onClick={() => setChallengeDone((d) => !d)}>
              <IconCheck size={16} /> {challengeDone ? t.doneToday : t.markDone}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GebedstijdenApp />);
</script>

<style>

.pt-app * { box-sizing: border-box; }
.pt-hero { background: linear-gradient(180deg, #0E4B43 0%, #123F38 100%); color: #F6F1E4; padding: 28px 24px 34px; position: relative; }
.pt-hero-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #BFDCD3; margin-bottom: 18px; gap: 10px; }
.pt-city-select { background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.25); color: #F6F1E4; border-radius: 100px; padding: 5px 12px; font-size: 13px; display: flex; align-items: center; gap: 6px; max-width: 62%; }
.pt-city-select select { background: transparent; border: none; color: #F6F1E4; font-size: 13px; outline: none; max-width: 100%; }
.pt-city-select select option, .pt-city-select select optgroup { color: #1E2B22; }
.pt-next-label { font-family: 'Amiri', serif; font-size: 15px; color: #D9B563; letter-spacing: 0.2px; }
.pt-next-name { font-family: 'Amiri', serif; font-size: 30px; font-weight: 700; margin: 4px 0 2px; }

.pt-tabs { display: flex; background: #FFFDF8; border-bottom: 1px solid #E4DCC8; }

.pt-row-icon { width: 34px; height: 34px; border-radius: 50%; background: #E9F0EA; color: #0E4B43; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pt-row.now .pt-row-icon { background: #0E4B43; color: #F6F1E4; }
.pt-row-nl { font-size: 14px; font-weight: 600; }
.pt-row-time { font-family: 'Amiri', serif; font-size: 18px; font-weight: 700; color: #0E4B43; }
.pt-note { font-size: 12px; color: #8B8672; margin-top: 14px; line-height: 1.5; }
.pt-verse-card { background: #FFFDF8; border: 1px solid #E4DCC8; border-radius: 16px; padding: 22px; text-align: center; }
.pt-verse-ref { font-size: 12px; color: #B8860B; letter-spacing: 0.5px; margin-bottom: 12px; }
.pt-verse-text { font-family: 'Amiri', serif; font-size: 19px; line-height: 1.6; color: #1E2B22; }
.pt-verse-nav { display: flex; justify-content: center; gap: 18px; margin-top: 18px; }
.pt-icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #E4DCC8; background: #FFFDF8; display: flex; align-items: center; justify-content: center; color: #0E4B43; cursor: pointer; }
.pt-zikr-select { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 20px; }
.pt-zikr-chip { flex-shrink: 0; padding: 7px 14px; border-radius: 100px; border: 1px solid #E4DCC8; background: #FFFDF8; font-size: 12.5px; color: #4B5A50; cursor: pointer; }
.pt-zikr-chip.active { background: #0E4B43; color: #F6F1E4; border-color: #0E4B43; }
.pt-counter-wrap { display: flex; flex-direction: column; align-items: center; }
.pt-counter-btn { width: 190px; height: 190px; border-radius: 50%; background: #FFFDF8; border: 2px solid #0E4B43; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; margin-bottom: 18px; }
.pt-counter-btn:active { transform: scale(0.97); }
.pt-counter-num { font-family: 'Amiri', serif; font-size: 46px; font-weight: 700; color: #0E4B43; }
.pt-counter-target { font-size: 12px; color: #B8860B; margin-top: 4px; }
.pt-reset { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6E7A6F; cursor: pointer; }
.pt-total { margin-top: 18px; font-size: 12.5px; color: #8B8672; }
.pt-challenge-card { background: #FFFDF8; border: 1px solid #E4DCC8; border-radius: 16px; padding: 24px; }
.pt-challenge-eyebrow { font-size: 12px; color: #B8860B; margin-bottom: 10px; }
.pt-challenge-text { font-size: 17px; line-height: 1.55; margin-bottom: 20px; }
.pt-done-btn { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #0E4B43; background: #0E4B43; color: #F6F1E4; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.pt-done-btn.done { background: #FFFDF8; color: #0E4B43; }
</style>
</body>
